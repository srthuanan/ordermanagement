<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>VinFast DMS Sync</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      margin-bottom: 10px;
    }
    select:focus, input[type="text"]:focus {
      border-color: #38bdf8;
    }
    #customDealerWrap {
      display: none;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 20px;
      font-weight: 500;
      word-break: break-word;
    }
    .dealers-panel {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #334155;
    }
    .dealers-panel-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dealer-tags {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }
    .dealer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid #334155;
    }
    .dealer-code {
      font-weight: 700;
      color: #f8fafc;
    }
    .badge-ok {
      font-size: 10px;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-none {
      font-size: 10px;
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h3>⚡ VinFast DMS Sync</h3>
  <div class="desc">Tự động lấy Cookie từ phiên DMS hiện tại và nạp vào máy tính để chạy Tra Cứu Tự Động.</div>

  <label for="selDealer">Chọn Showroom cần đồng bộ:</label>
  <select id="selDealer">
    <option value="N31913">N31913 - Showroom Thuận An</option>
    <option value="N31923">N31923 - Showroom N31923</option>
    <option value="N31920">N31920 - Showroom N31920</option>
    <option value="N31901">N31901 - Showroom N31901</option>
    <option value="N31903">N31903 - Showroom N31903</option>
    <option value="N31917">N31917 - Showroom N31917</option>
    <option value="__OTHER__">➕ Nhập mã Showroom khác...</option>
  </select>

  <div id="customDealerWrap">
    <label for="txtCustomDealer">Mã Showroom khác:</label>
    <input type="text" id="txtCustomDealer" placeholder="VD: N31905, N31925..." />
  </div>

  <button id="btnSync">🚀 ĐỒNG BỘ COOKIE VÀO APP</button>
  <div id="status"></div>

  <div class="dealers-panel">
    <div class="dealers-panel-title">
      <span>📋 Cookie các Showroom trong App</span>
      <span id="btnReloadDealers" style="cursor:pointer;color:#38bdf8;" title="Tải lại danh sách">🔄</span>
    </div>
    <div id="dealerTags" class="dealer-tags">
      <div style="font-size:11px;color:#64748b;text-align:center;padding:10px;">Đang tải danh sách...</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
