function renderStock(){const visible=filteredStock();$('total-count').textContent=stock.length;$('stock-count').textContent=visible.length+' / '+stock.length+' xe';$('stock-tabs').innerHTML=['','Chưa ghép','Đang giữ','Đã ghép'].map(s=>`<button class="${s===statusChoice?'on':''}" data-stock-status="${s}">${s||'Tất cả xe'}<small>${s?stock.filter(c=>c.status===s).length:stock.length}</small></button>`).join('');const groups=[...new Set(visible.map(c=>c.model))];$('stock-gallery').innerHTML=groups.map(m=>{const group=visible.filter(c=>c.model===m);const all=stock.filter(c=>c.model===m);const c=group[0];return `<section class="group-card"><div class="group-heading"><h2>${m}</h2><small>${all.length} xe · ${all.filter(c=>c.status==='Chưa ghép').length} chưa ghép</small></div><button class="group-photo" data-open-model="${m}" aria-label="Xem tất cả ${all.length} xe ${m}"><img src="${esc(c.image)}" alt="${m}"></button><div class="group-color"><span>${esc(c.color)} / ${esc(c.interior)}</span><span>${all.filter(c=>c.status==='Đang giữ').length} giữ · ${all.filter(c=>c.status==='Đã ghép').length} ghép</span></div>${group.slice(0,3).map(previewRow).join('')}<button class="group-more" style="width:100%" data-open-model="${m}"><span>Xem đầy đủ ${all.length} xe →</span><small>${group.length>3?'Còn '+(group.length-3)+' xe':''}</small></button></section>`}).join('')||'<div class="empty-result">Không tìm thấy xe. Hãy thay đổi từ khóa hoặc bộ lọc.</div>';document.querySelectorAll('[data-stock-status]').forEach(b=>b.onclick=()=>{statusChoice=b.dataset.stockStatus;renderStock()});document.querySelectorAll('[data-open-model]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.openModel));bindActions($('stock-gallery'))}
function openDrawer(model,vin=''){lastFocus=document.activeElement;drawerModel=model;drawerSearch='';drawerStatus='';drawerVersion='';$('drawer-search').value='';$('drawer-status').value='';$('drawer-version').value='';selectedVIN=vin||stock.find(c=>c.model===model)?.vin||'';detailTab='specs';$('drawer-overlay').hidden=false;renderDrawer();$('close-drawer').focus()}

function renderDrawer(){if($('drawer-overlay').hidden)return;const all=stock.filter(c=>c.model===drawerModel&&(!liveGroupKey||liveKey(c)===liveGroupKey));const visible=drawerVehicles();if(!visible.some(c=>c.vin===selectedVIN))selectedVIN=visible[0]?.vin||'';$('drawer-title').textContent=drawerModel+' · Danh sách VIN';$('drawer-subtitle').textContent=`${all.length} xe · ${all.filter(c=>c.status==='Chưa ghép').length} chưa ghép · ${all.filter(c=>c.status==='Đang giữ').length} đang giữ · ${all.filter(c=>c.status==='Đã ghép').length} đã ghép`;$('drawer-count').textContent=visible.length+' / '+all.length+' xe';$('vin-list').innerHTML=visible.map(c=>`<button class="list-vin ${c.vin===selectedVIN?'selected':''}" data-select-vin="${c.vin}"><span class="top"><strong>${esc(c.vin)}</strong><span class="status" style="--tone:${tone(c.status)}">${c.status}</span></span><span class="meta"><span>${c.model} · ${c.version} · ${esc(c.interior)}</span><span>${esc(c.location)}</span></span><div class="holder">${c.holder?esc(c.holder)+(c.expiry?' · Hết hạn '+fmt(c.expiry):''):'Chưa có người giữ'}${c.queue.includes(USER)?' · Bạn đang đăng ký chờ':''}</div></button>`).join('')||'<div class="empty-result">Không tìm thấy VIN phù hợp.</div>';$('vin-list').querySelectorAll('[data-select-vin]').forEach(b=>b.onclick=()=>{selectedVIN=b.dataset.selectVin;detailTab='specs';renderDrawer()});renderDetail()}
function detailFields(c){return [['Dòng xe',c.model+' - '+c.version],['Màu sắc',c.color+' / '+c.interior],['Số VIN',c.vin,'copy'],['Số máy',c.engine,'copy'],['Mã DMS',c.dms,'copy'],['Số COC',c.coc,'copy'],['Kho xe',c.warehouse],['Vị trí hiện tại',c.location],['Vị trí đỗ',c.parking],['Bãi thực tế',c.realWarehouse||'—'],['Trạng thái',c.status],['Người giữ',c.holder||'—'],['Thời hạn',c.expiry?fmt(c.expiry):'—'],['Ngày nhập kho',c.received.split('-').reverse().join('/')],['Ngày vận tải',c.transport?c.transport.split('-').reverse().join('/'):'—'],['Mã phiên bản',c.versionCode||'—'],['Đơn hàng',c.order||'Chưa ghép đơn'],['Ghi chú DMS',c.notes||'—']]}
function renderDetail(){const c=getVIN(selectedVIN);if(!c){$('vin-detail').innerHTML='<div class="empty-result">Chọn một VIN để xem đầy đủ thông tin.</div>';return}let content='';if(detailTab==='specs')content=`<div class="detail-section-title"><span>THÔNG SỐ XE</span>${mode==='admin'?`<button class="btn" data-action="edit" data-vin="${c.vin}">✎ Chỉnh sửa</button>`:''}</div>${detailFields(c).map(([label,value,type])=>`<div class="field-row"><span class="field-label">${label}</span>${type==='copy'?`<button class="copy-value" data-copy="${esc(value)}" title="Sao chép ${label}">${esc(value)}</button>`:`<span class="field-value">${esc(value)}</span>`}</div>`).join('')}${c.coords?`<div class="field-row"><span class="field-label">GPS vận tải</span><button class="copy-value" data-action="map" data-vin="${c.vin}">${esc(c.coords.address)} ↗</button></div>`:''}<div class="detail-actions">${primaryActions(c)}${mode==='admin'?`<button class="btn danger" data-action="delete" data-vin="${c.vin}">Xóa xe khỏi mẫu</button>`:''}</div><div class="queue-box"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Hàng chờ · ${c.queue.length} người</strong>${!readonly()&&!isMine(c)&&c.status!=='Chưa ghép'?`<button class="btn small" role="switch" aria-checked="${c.queue.includes(USER)}" data-action="${c.queue.includes(USER)?'leave':'queue'}" data-vin="${c.vin}">${c.queue.includes(USER)?'Đang chờ · Hủy':'Đăng ký chờ'}</button>`:''}</div>${c.queue.length?c.queue.map((name,i)=>`<div class="queue-person"><span>${i+1}. ${esc(name)}</span><span>${name===USER?'Bạn':''}</span></div>`).join(''):'Chưa có người đăng ký chờ.'}<div style="margin-top:7px">Nhả xe sẽ chuyển lượt theo thứ tự FIFO trong dữ liệu thử.</div></div>`;else content=c.logs.map(l=>`<div class="log-entry"><time>${esc(l.time)}</time>${esc(l.text)}</div>`).join('');$('vin-detail').innerHTML=`<div class="detail-hero"><img src="${esc(c.image)}" alt="${c.model}"><div><h3>${c.model} <small>${c.version}</small></h3><p>${esc(c.color)} / ${esc(c.interior)}</p><p style="margin-top:9px;color:${tone(c.status)}">● ${c.status}${isMine(c)?' · Tôi đang giữ':''}</p></div></div><div class="detail-tabs"><button data-detail-tab="specs" class="${detailTab==='specs'?'on':''}">Thông số & tác nghiệp</button><button data-detail-tab="logs" class="${detailTab==='logs'?'on':''}">Nhật ký (${c.logs.length})</button></div>${content}`;const stickyActions=$('vin-detail').querySelector('.detail-actions');if(stickyActions)$('vin-detail').querySelector('.detail-tabs').after(stickyActions);bindActions($('vin-detail'));$('vin-detail').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);message('Đã sao chép đầy đủ: '+b.dataset.copy)}catch{message('Giá trị cần sao chép: '+b.dataset.copy)}});$('vin-detail').querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detailTab;renderDetail()})}

function showAction(c,action){modalTarget=c.vin;modalAction=action;let title='',body='',submit='Xác nhận';const input=(name,label,value='',type='text')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required></label>`;if(action==='hold'){title='Giữ xe trong 24 giờ';body='Xe sẽ được giữ cho '+USER+'. Nếu ngày hết hạn rơi vào Chủ nhật, thời hạn được cộng thêm 24 giờ.'}else if(action==='release'){title=mode==='admin'&&!isMine(c)?'Hủy giữ xe (Quản trị viên)':'Nhả xe';body='Xe sẽ chuyển cho người đầu hàng chờ; nếu chưa có hàng chờ sẽ trở về Chưa ghép.'}else if(action==='queue'){title='Đăng ký hàng chờ';body='Bạn sẽ ở vị trí '+(c.queue.length+1)+' trong hàng chờ của VIN này.'}else if(action==='leave'){title='Hủy đăng ký chờ';body='Bạn sẽ được gỡ khỏi hàng chờ của VIN này.'}else if(action==='extend'){title=c.extension?'Yêu cầu gia hạn đã gửi':'Xin gia hạn giữ xe';body=c.extension?'Yêu cầu đang chờ quản trị viên duyệt.':input('reason','Lý do xin gia hạn')+'<p>Gửi yêu cầu gia hạn thêm 24 giờ để quản trị viên xem xét.</p>';submit=c.extension?'Đóng':'Gửi yêu cầu'}else if(action==='approve-extension'){title='Duyệt gia hạn 24 giờ';body='Cộng thêm 24 giờ vào thời hạn hiện tại. Nếu rơi vào Chủ nhật, cộng thêm 24 giờ.'}else if(action==='match'){title='Tạo yêu cầu ghép xe';body=input('customer','Tên khách hàng')+input('order','Số đơn hàng')+input('note','Ghi chú','Yêu cầu ghép xe trong bản thử');submit='Gửi yêu cầu mẫu'}else if(action==='swap'){title='Đề nghị đổi xe cùng cấu hình';const own=stock.filter(o=>o.vin!==c.vin&&isMine(o)&&o.status==='Đang giữ'&&o.model===c.model&&o.version===c.version&&o.color===c.color&&o.interior===c.interior);body=`<label>Xe của bạn (cùng dòng, phiên bản và màu)<select name="source" required>${own.map(o=>`<option value="${o.vin}">${o.vin} · ${o.version}</option>`).join('')}</select></label>`+input('reason','Lý do đề nghị đổi')+'<p>Ghi nhận đề nghị trong nhật ký, không tự đổi chủ giữ xe.</p>'}else if(action==='edit'){title='Chỉnh sửa thông tin xe (Admin)';body=input('vin','Số VIN (17 ký tự)',c.vin)+input('model','Dòng xe',c.model)+input('version','Phiên bản',c.version)+input('color','Ngoại thất',c.color)+input('interior','Nội thất',c.interior)+input('engine','Số máy',c.engine)+input('dms','Mã DMS',c.dms)+input('coc','Số COC',c.coc)+input('warehouse','Kho quản lý',c.warehouse)+input('location','Vị trí hiện tại',c.location)+input('parking','Vị trí đỗ',c.parking)+input('notes','Ghi chú DMS',c.notes);submit='Lưu dữ liệu mẫu'}else if(action==='delete'){title='Xóa xe khỏi dữ liệu mẫu';body=input('reason','Lý do xóa')+'<p>Chỉ xóa bản ghi trong trình duyệt. Có thể khôi phục bằng Đặt lại dữ liệu mẫu.</p>';submit='Xóa khỏi mẫu'}else if(action==='map'){title='Vị trí GPS vận tải';body=`<div class="map-schematic">📍 ${esc(c.coords.address)}</div><p>Tọa độ: ${c.coords.lat}, ${c.coords.lng}<br>Vận tốc: ${c.coords.speed} km/h<br>Cập nhật: ${c.coords.captured}</p><a href="https://www.google.com/maps?q=${c.coords.lat},${c.coords.lng}" target="_blank" rel="noopener" style="color:#205eb4">Mở tọa độ trên Google Maps ↗</a><p>Sơ đồ và GPS là dữ liệu minh họa.</p>`;submit='Đóng'}else return;$('modal-title').textContent=title;$('modal-content').innerHTML=`<div class="modal-vin">${esc(c.model)} ${esc(c.version)} · ${esc(c.vin)}</div>${body}<div class="modal-error" id="modal-error" role="alert"></div>`;$('confirm-action').textContent=submit;$('action-dialog').showModal()}
function guard(c,a){if(a==='map')return true;if(readonly())return false;if(['edit','delete','approve-extension'].includes(a))return mode==='admin';if(a==='hold')return c.status==='Chưa ghép'&&canHold();if(a==='release')return c.status==='Đang giữ'&&(isMine(c)||mode==='admin');if(['extend','match'].includes(a))return c.status==='Đang giữ'&&isMine(c);if(['queue','leave'].includes(a))return c.status!=='Chưa ghép'&&!isMine(c);return true}
function plusDay(value){const d=new Date(value);d.setTime(d.getTime()+24*60*60*1000);if(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Ho_Chi_Minh',weekday:'short'}).format(d)==='Sun')d.setTime(d.getTime()+24*60*60*1000);return d.toISOString()}
$('action-form').onsubmit=e=>{e.preventDefault();const c=getVIN(modalTarget),a=modalAction;if(!c)return;if(!guard(c,a)){$('modal-error').textContent='Trạng thái hoặc quyền hiện tại không cho phép thao tác này.';return}const data=Object.fromEntries(new FormData(e.target));if(a==='hold'){c.status='Đang giữ';c.holder=USER;c.expiry=plusDay(DEMO_NOW);log(c,'TVBH '+USER+' giữ xe 24 giờ.')}else if(a==='release'){const next=c.queue.shift();c.status=next?'Đang giữ':'Chưa ghép';c.holder=next||'';c.expiry=next?plusDay(DEMO_NOW):'';c.extension=false;log(c,next?'Nhả xe, chuyển lượt cho '+next+' theo FIFO.':'Nhả xe, xe trở về Chưa ghép.')}else if(a==='queue'){if(!c.queue.includes(USER))c.queue.push(USER);log(c,USER+' đăng ký hàng chờ.')}else if(a==='leave'){c.queue=c.queue.filter(n=>n!==USER);log(c,USER+' hủy hàng chờ.')}else if(a==='extend'){if(!c.extension){if(!data.reason?.trim()){$('modal-error').textContent='Nhập lý do xin gia hạn.';return}c.extension=true;log(c,'Xin gia hạn 24 giờ: '+data.reason.trim())}}else if(a==='approve-extension'){if(!c.extension){$('modal-error').textContent='Không có yêu cầu gia hạn để duyệt.';return}c.expiry=plusDay(c.expiry);c.extension=false;log(c,'Quản trị viên duyệt gia hạn thêm 24 giờ.')}else if(a==='match'){if(!data.customer?.trim()||!data.order?.trim()){$('modal-error').textContent='Nhập đầy đủ khách hàng và số đơn hàng.';return}c.request={customer:data.customer.trim(),order:data.order.trim(),note:data.note?.trim()};log(c,'Gửi yêu cầu ghép xe cho '+data.customer.trim()+' · '+data.order.trim()+'. Đang chờ phê duyệt; xe vẫn đang giữ.')}else if(a==='swap'){const source=getVIN(data.source);if(!source||!isMine(source)||source.status!=='Đang giữ'||source.model!==c.model||source.version!==c.version||source.color!==c.color||source.interior!==c.interior||!data.reason?.trim()){$('modal-error').textContent='Cần chọn xe đang giữ cùng cấu hình và nhập lý do.';return}log(c,'Đề nghị đổi từ '+source.vin+': '+data.reason.trim());log(source,'Đề nghị đổi sang '+c.vin+'. Đang chờ người giữ xe phản hồi.')}else if(a==='edit'){const newVIN=data.vin.trim().toUpperCase();if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(newVIN)||stock.some(o=>o!==c&&o.vin===newVIN)){$('modal-error').textContent='VIN phải có 17 ký tự hợp lệ và không trùng xe khác.';return}for(const name of ['model','version','color','interior','engine','dms','coc','warehouse','location','parking','notes']){if(!data[name]?.trim()){$('modal-error').textContent='Điền đầy đủ các trường thông tin.';return}}const oldVIN=c.vin;Object.assign(c,Object.fromEntries(Object.entries(data).map(([k,v])=>[k,String(v).trim()])));c.vin=newVIN;if(selectedVIN===oldVIN){selectedVIN=c.vin;drawerModel=c.model}log(c,'Quản trị viên chỉnh sửa thông tin xe mẫu.')}else if(a==='delete'){if(!data.reason?.trim()){$('modal-error').textContent='Cần nhập lý do xóa.';return}stock=stock.filter(o=>o!==c);persist()}$('action-dialog').close();refresh();message(a==='map'?'Đã đóng vị trí GPS.':'Đã cập nhật dữ liệu thử trong trình duyệt · Không tác động kho thật.')};
$('cancel-action').onclick=()=>$('action-dialog').close();$('close-drawer').onclick=closeDrawer;$('drawer-overlay').onclick=e=>{if(e.target===$('drawer-overlay'))closeDrawer()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('action-dialog').open&&!$('drawer-overlay').hidden){e.preventDefault();closeDrawer()}if(e.key==='Tab'&&!$('drawer-overlay').hidden&&!$('action-dialog').open){const list=Array.from($('drawer-overlay').querySelectorAll('button,input,select,a[href]')).filter(el=>!el.disabled&&el.getClientRects().length);const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('stock-search').oninput=e=>{keyword=e.target.value;renderStock()};$('warehouse-filter').onchange=e=>{warehouseChoice=e.target.value;renderStock()};$('drawer-search').oninput=e=>{drawerSearch=e.target.value;renderDrawer()};$('drawer-status').onchange=e=>{drawerStatus=e.target.value;renderDrawer()};$('drawer-version').onchange=e=>{drawerVersion=e.target.value;renderDrawer()};$('role').onchange=e=>{mode=e.target.value;renderStock();renderDrawer()};$('reset-demo').onclick=()=>{if($('action-dialog').open)$('action-dialog').close();stock=seedVehicles();keyword='';statusChoice='';warehouseChoice='';$('stock-search').value='';$('warehouse-filter').value='';refresh();message('Đã khôi phục 25 xe mẫu, trong đó VF 6 có 20 VIN.')};$('export-demo').onclick=()=>{const fields=detailFields(stock[0]).map(f=>f[0]);const rows=[fields,...filteredStock().map(c=>detailFields(c).map(f=>f[1]))];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='kho-xe-mau-day-du.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.querySelectorAll function showMore(c,trigger){if(menuTrigger===trigger&&!menu.hidden){closeMore();return}closeMore();menuTrigger=trigger;trigger.setAttribute('aria-expanded','true');const temp=document.createElement('div');temp.innerHTML=readonly()?'':primaryActions(c);const primary=choosePrimary(c);const actions=[{action:'detail',label:'Xem đầy đủ thông tin'},{action:'logs',label:'Xem nhật ký'}];for(const b of temp.querySelectorAll('[data-action]'))if(!primary||b.dataset.action!==primary.dataset.action)actions.push({action:b.dataset.action,label:b.textContent});if(mode==='admin'){actions.push({action:'edit',label:'Chỉnh sửa thông tin'},{action:'delete',label:'Xóa xe khỏi mẫu'})}if(c.coords)actions.push({action:'map',label:'Xem vị trí GPS'});menu.innerHTML=`<div class="menu-title">${esc(c.vin)}</div>`+actions.map(a=>`<button role="menuitem" data-menu-action="${a.action}" data-vin="${c.vin}">${esc(a.label)}</button>`).join('');menu.hidden=false;const r=trigger.getBoundingClientRect();const h=menu.getBoundingClientRect().height;menu.style.left=Math.max(8,Math.min(r.right-224,innerWidth-232))+'px';menu.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-h-8))+'px';menu.querySelectorAll('[data-menu-action]').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.menuAction;closeMore();if(a==='detail'||a==='logs'){selectedVIN=c.vin;drawerStep='detail';detailTab=a==='logs'?'logs':'specs';renderDrawer();$('back-to-list').focus()}else if(!readonly()||a==='map')showAction(c,a)});menu.querySelector('button')?.focus()}

async function readRows(table,columns,extra={}){const rows=[];let offset=0,total=null;while(true){const params=new URLSearchParams({select:columns,limit:'500',offset:String(offset),...extra});const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),25000);let response;try{response=await fetch(`${LIVE_ORIGIN}/rest/v1/${table}?${params}`,{method:'GET',headers:{apikey:LIVE_PUBLIC_KEY,Prefer:'count=exact'},signal:controller.signal,cache:'no-store',credentials:'omit'})}finally{clearTimeout(timer)}if(!response.ok){if(response.status===401||response.status===403)throw new Error('Không có quyền đọc '+table+'. Hãy mở bản xem trước bằng tài khoản có quyền xem kho; bản mẫu không tự nâng quyền.');throw new Error('Không đọc được '+table+' (HTTP '+response.status+').')}const range=response.headers.get('content-range')||'';const match=range.match(/\/(\d+)$/);if(match)total=Number(match[1]);const batch=await response.json();if(!Array.isArray(batch))throw new Error('Dữ liệu '+table+' không đúng định dạng.');rows.push(...batch);if(total!==null&&rows.length>=total)break;if(!batch.length)break;offset+=batch.length;if(total===null&&batch.length<500)break;if(offset>100000)throw new Error('Số lượng bản ghi vượt giới hạn đọc của mẫu.')}if(total!==null&&rows.length!==total)throw new Error('Dữ liệu '+table+' thay đổi trong khi tải. Hãy bấm Tải lại kho thật.');return rows}
async function readRowsByVINs(table,columns,vins,extra={}){const out=[];for(let i=0;i<vins.length;i+=120){const chunk=vins.slice(i,i+120);const inFilter='in.('+chunk.map(v=>'"'+v.replaceAll('"','')+'"').join(',')+')';const part=await readRows(table,columns,{...extra,vin:inFilter});out.push(...part)}return out}
function mapRealRows(rows,telemetry,activities){const telemetryByVIN=new Map(telemetry.map(t=>[String(t.vin||'').trim().toUpperCase(),t]));const queueByVIN=new Map();for(const a of activities){if(!['waiting','notified','prioritized'].includes(a.status)||a.type!=='QUEUE')continue;const vin=String(a.vin||'').trim().toUpperCase();const q=queueByVIN.get(vin)||[];const name=String(a.tvbh_name||a.username||'').trim();if(name&&!q.includes(name))q.push(name);queueByVIN.set(vin,q)}return rows.filter(r=>String(r.vin||'').trim()).map(r=>{const vin=String(r.vin).trim().toUpperCase();const t=telemetryByVIN.get(vin);const c={vin,model:String(r.dong_xe||'Chưa cập nhật').trim(),version:String(r.phien_ban||'').trim(),color:String(r.ngoai_that||'').trim(),interior:String(r.noi_that||'').trim(),paint:paintHex(r.ngoai_that),engine:String(r.so_may||''),dms:String(r.ma_dms||''),coc:String(r.so_coc||''),warehouse:String(r.vi_tri||''),location:String(r.vi_tri||''),parking:'',realWarehouse:'',status:String(r.trang_thai||'Chưa cập nhật').trim(),holder:String(r.nguoi_giu_xe||'').trim(),expiry:parseLiveDate(r.thoi_gian_het_han_giu),expiryText:String(r.thoi_gian_het_han_giu||''),received:liveDateOnly(r.ngay_nhap),transport:liveDateOnly(r.ngay_van_tai),versionCode:String(r.ma_phien_ban||''),notes:String(r.ghi_chu_dms||r.ghi_chu||''),queue:queueByVIN.get(vin)||[],extension:!!r.is_extension_requested,extensionReason:String(r.extension_reason||''),order:'',coords:t&&Number.isFinite(Number(t.lat))&&Number.isFinite(Number(t.lng))&&t.lat!==null&&t.lng!==null?{lat:Number(t.lat),lng:Number(t.lng),speed:Number(t.speed||0),address:'Tọa độ GPS từ dữ liệu nguồn',captured:fmt(t.captured_at)}:null,logs:[],source:'live'};c.imageInfo=imageFor(c);c.image=c.imageInfo.src;c.logs=[{time:sourceLoadedAt,text:'Đã đọc bản chụp dữ liệu kho thật. Các nhật ký thao tác tiếp theo chỉ là mô phỏng trong bộ nhớ trang.'}];return c})}
function simulatedCount(){const real=new Map(realBaseline.map(c=>[c.vin,c]));let count=0;for(const c of stock){const baseline=real.get(c.vin);if(!baseline||JSON.stringify(c)!==JSON.stringify(baseline))count++;real.delete(c.vin)}return count+real.size}
function updateLiveBanner(){const banner=document.querySelector('.demo-banner');if(!banner)return;if(loadingLive){banner.innerHTML='<span>Đang đọc kho xe thật… Chỉ gửi yêu cầu GET.</span><span class="live-meta">Các nút thao tác không ghi lên hệ thống.</span>';return}const dirty=simulatedCount();banner.innerHTML=`<span><b class="live-source">DỮ LIỆU KHO THẬT · ${realBaseline.length} XE</b> · Thao tác chỉ mô phỏng, không ghi nhận lên hệ thống.${dirty?' <span class="filter-state">Đang có '+dirty+' VIN thay đổi thử.</span>':''}${loadWarnings.length?' <span class="live-warning">'+esc(loadWarnings.join(' '))+'</span>':''}</span><span class="live-meta">Đọc lúc ${esc(sourceLoadedAt||'—')}</span>`}
log=function(c,text){c.logs.unshift({time:fmt(new Date().toISOString())+' · Mô phỏng',text});};
refresh=function(){renderStock();renderDrawer();updateLiveBanner()};
detailFields=function(c){const fields=originalDetailFields(c).map(([label,value,type])=>[label,value||'—',type]);for(const f of fields){if(f[0]==='Thời hạn'&&c.expiryText&&!c.expiry)f[1]=c.expiryText;if(f[0]==='Đơn hàng'&&!c.order)f[1]='Không có trong dữ liệu nguồn';if(f[0]==='Kho xe'&&c.location==='Đang vận tải')f[1]='—';}return fields};
function syncDrawerVersions(){const sel=$('drawer-version');if(!sel)return;const pool=stock.filter(c=>c.model===drawerModel&&(!liveGroupKey||liveKey(c)===liveGroupKey));const versions=[...new Set(pool.map(c=>c.version).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));if(drawerVersion&&!versions.includes(drawerVersion))drawerVersion='';sel.innerHTML='<option value="">Tất cả phiên bản</option>'+versions.map(v=>`<option value="${esc(v)}" ${v===drawerVersion?'selected':''}>${esc(v)}</option>`).join('')}
drawerVehicles=function(){return originalDrawerVehicles().filter(c=>!liveGroupKey||liveKey(c)===liveGroupKey)};
openDrawer=function(model,vin='',keepGroup=false){if(vin){const c=getVIN(vin);if(!keepGroup)liveGroupKey=c?liveKey(c):''}drawerModel=model;syncDrawerVersions();originalLiveOpen(model,vin)};
renderDrawer=function(){syncDrawerVersions();originalRenderDrawer()};
renderDetail=function(){originalRenderDetail();const c=getVIN(selectedVIN);if(!c)return;const root=$('vin-detail');if(!root)return;const image=root.querySelector('.detail-hero img');if(image){if(c.imageInfo?.src){image.src=c.imageInfo.src;image.setAttribute('data-live-image','')}else{const placeholder=document.createElement('div');placeholder.className='image-missing';placeholder.style.width='145px';placeholder.style.height='88px';placeholder.textContent='Chưa có ảnh';image.replaceWith(placeholder)}}const queue=root.querySelector('.queue-box>div:last-child');if(queue&&queue.textContent.includes('FIFO'))queue.textContent='Hàng chờ đọc từ nguồn. Các đăng ký/hủy chờ tại đây chỉ mô phỏng.';enhanceImages(root)};
showAction=function(c,action){originalShowAction(c,action);const notice=document.createElement('p');notice.className='mode-note';notice.textContent='CHỈ THỬ GIAO DIỆN · Không gửi yêu cầu hay cập nhật dữ liệu kho thật.';$('modal-content').prepend(notice)};
$('export-demo').onclick=()=>{const list=filteredStock();if(!list.length){message('Không có dữ liệu xe phù hợp để xuất CSV.');return}const fields=detailFields(list[0]).map(f=>f[0]);const rows=[fields,...list.map(c=>detailFields(c).map(f=>f[1]))];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='kho-xe-xem-truoc.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function restoreSnapshot(){if(loadingLive)return;if($('action-dialog').open)$('action-dialog').close();closeMore();stock=structuredClone(realBaseline);keyword='';statusChoice='';warehouseChoice='';$('stock-search').value='';$('warehouse-filter').value='';if(typeof onLiveReset==='function')onLiveReset();refresh();message('Đã hủy toàn bộ thay đổi thử, khôi phục dữ liệu kho thật đã đọc.')}
async function loadLiveStock(){if(loadingLive)return;loadingLive=true;$('load-live-stock').disabled=true;$('reset-demo').disabled=true;closeMore();closeDrawer();stock=[];realBaseline=[];sourceLoadedAt='';loadWarnings=[];renderStock();updateLiveBanner();try{const rows=await readRows('khoxe','*',{order:'vin.asc'});const vins=rows.map(r=>String(r.vin||'').trim()).filter(Boolean);let telemetry=[],activities=[];if(vins.length){const optional=await Promise.allSettled([readRowsByVINs('car_telemetry','vin,lat,lng,speed,heading,captured_at',vins,{order:'vin.asc'}),readRowsByVINs('car_hold_activities','id,vin,username,tvbh_name,type,status,created_at',vins,{order:'created_at.asc,id.asc',type:'eq.QUEUE',status:'in.(waiting,notified,prioritized)'})]);if(optional[0].status==='fulfilled')telemetry=optional[0].value;else loadWarnings.push('Chưa đọc được GPS.');if(optional[1].status==='fulfilled')activities=optional[1].value;else loadWarnings.push('Chưa đọc được hàng chờ.')}sourceLoadedAt=fmt(new Date().toISOString());stock=mapRealRows(rows,telemetry,activities);if(new Set(stock.map(c=>c.vin)).size!==stock.length)throw new Error('Dữ liệu nguồn có VIN trùng. Bản mẫu chưa hiển thị để tránh thao tác nhầm.');realBaseline=structuredClone(stock);const locations=[...new Set(stock.map(c=>c.location).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));$('warehouse-filter').innerHTML='<option value="">Tất cả kho</option>'+locations.map(w=>`<option>${esc(w)}</option>`).join('');$('live-identity').innerHTML='<option value="NGƯỜI DÙNG THỬ">Người dùng thử</option>'+[...new Set(stock.map(c=>c.holder).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi')).map(n=>`<option>${esc(n)}</option>`).join('');USER='NGƯỜI DÙNG THỬ';if(typeof onLiveLoaded==='function')onLiveLoaded();}catch(error){stock=[];realBaseline=[];loadingLive=false;renderStock();document.querySelector('.demo-banner').innerHTML='<span class="live-load-error">'+esc(error.name==='AbortError'?'Kết nối quá thời gian. Hãy bấm Tải lại kho thật.':error.message)+'</span>';const target=$('stock-gallery')||$('variant-workspace');if(target)target.innerHTML='<div class="live-loading" style="padding:36px 30px">Không tải được kho thật. Bản mẫu không hiển thị dữ liệu giả thay thế.<br><button class="btn" id="retry-live">Thử tải lại</button></div>';if($('retry-live'))$('retry-live').onclick=loadLiveStock;return}finally{loadingLive=false;$('load-live-stock').disabled=false;$('reset-demo').disabled=false}refresh()}
const refreshButton=document.createElement('button');refreshButton.id='load-live-stock';refreshButton.className='btn';refreshButton.textContent='Tải lại kho thật';$('reset-demo').before(refreshButton);$('reset-demo').textContent='Hủy thay đổi thử';$('reset-demo').onclick=restoreSnapshot;refreshButton.onclick=loadLiveStock;
const identity=document.createElement('label');identity.innerHTML='Người thao tác thử <select id="live-identity" class="identity"><option>Người dùng thử</option></select>';$('role').closest('label').before(identity);$('live-identity').onchange=e=>{USER=e.target.value;refresh()};$('role').innerHTML='<option value="staff">TVBH · Mô phỏng</option><option value="admin">Quản trị · Mô phỏng</option><option value="readonly">Chỉ xem</option>';
document.querySelector('.drawer-bottom span:last-child').textContent='Dữ liệu thật · Nút thao tác chỉ mô phỏng';


let cockpitGroup='ALL',cockpitVersion='';
const galleryEl=$('stock-gallery');
const cockpitShell=document.createElement('div');
cockpitShell.id='variant-workspace';
cockpitShell.className='cockpit-shell';
cockpitShell.innerHTML=`
  <section class="cockpit-col" aria-label="Nhóm dòng xe và màu">
    <div class="col-head"><strong>1 · Dòng xe & Phối màu</strong><small id="cg-count"></small></div>
    <div class="col-scroll" id="cockpit-groups"></div>
  </section>
  <section class="cockpit-col" aria-label="Danh sách số VIN">
    <div class="col-head"><div><strong id="cv-title">2 · Danh sách VIN</strong> <small id="cv-count"></small></div><select id="cockpit-version" aria-label="Lọc phiên bản"><option value="">Tất cả phiên bản</option></select></div>
    <div class="col-scroll" id="cockpit-vins"></div>
  </section>
  <section class="cockpit-col" aria-label="Chi tiết hộ chiếu xe">
    <div class="col-head"><strong>3 · Hộ chiếu & Tác nghiệp VIN</strong><small id="cd-vin"></small></div>
    <div id="cockpit-detail"></div>
  </section>`;
galleryEl.replaceWith(cockpitShell);

function onLiveReset(){cockpitGroup='ALL';cockpitVersion=''}
function onLiveLoaded(){selectedVIN=stock[0]?.vin||''}

function renderCockpitDetail(){
  const host=$('cockpit-detail');
  if(!selectedVIN||!getVIN(selectedVIN)){
    host.innerHTML='<div class="empty-result">Chọn một VIN ở cột giữa để xem đầy đủ 18 trường thông tin xe.</div>';
    $('cd-vin').textContent='—';
    return;
  }
  $('cd-vin').textContent=selectedVIN;
  const drawerDetail=$('vin-detail');
  const tempId=drawerDetail.id;
  drawerDetail.id='vin-detail-drawer-backup';
  host.id='vin-detail';
  renderDetail();
  host.id='cockpit-detail';
  drawerDetail.id=tempId;
}

renderStock=function(){
  closeMore();
  const visible=filteredStock();
  $('total-count').textContent=stock.length;
  $('stock-count').textContent=visible.length+' / '+stock.length+' xe';
  const statuses=['',...new Set(['Chưa ghép','Đang giữ','Đã ghép',...stock.map(c=>c.status)])];
  $('stock-tabs').innerHTML=statuses.map(s=>`<button class="${s===statusChoice?'on':''}" data-stock-status="${esc(s)}">${esc(s||'Tất cả xe')}<small>${s?stock.filter(c=>c.status===s).length:stock.length}</small></button>`).join('');
  $('stock-tabs').querySelectorAll('[data-stock-status]').forEach(b=>b.onclick=()=>{statusChoice=b.dataset.stockStatus;renderStock()});

  if(loadingLive){
    $('cockpit-groups').innerHTML='<div class="empty-result">Đang tải kho thật…</div>';
    $('cockpit-vins').innerHTML='<div class="empty-result">Đang tải danh sách VIN…</div>';
    $('cockpit-detail').innerHTML='<div class="empty-result">Đang đồng bộ thông số…</div>';
    return;
  }

  const keys=[...new Set(visible.map(liveKey))];
  if(cockpitGroup!=='ALL'&&!keys.includes(cockpitGroup))cockpitGroup='ALL';
  $('cg-count').textContent=keys.length+' nhóm';

  $('cockpit-groups').innerHTML=(visible.length?`<button class="group-item ${cockpitGroup==='ALL'?'active':''}" data-cg="ALL">
    <div class="group-thumb">${visible[0]?.imageInfo?.src?`<img data-live-image src="${esc(visible[0].imageInfo.src)}" alt="">`:'<span>ALL</span>'}</div>
    <div class="group-meta"><strong>Tất cả dòng xe</strong><span>Toàn bộ kết quả lọc</span></div>
    <div class="group-badge"><b>${visible.filter(c=>c.status==='Chưa ghép').length}</b><span>/${visible.length} xe</span></div>
  </button>`:'')+keys.map(k=>{
    const g=visible.filter(c=>liveKey(c)===k);
    const c=g[0];
    return `<button class="group-item ${cockpitGroup===k?'active':''}" data-cg="${esc(k)}">
      <div class="group-thumb">${c.imageInfo?.src?`<img data-live-image src="${esc(c.imageInfo.src)}" alt="${esc(c.model)}">`:'<div class="image-missing">—</div>'}</div>
      <div class="group-meta"><strong>${esc(c.model)}</strong><span><i class="swatch" style="--paint:${c.paint};width:9px;height:9px;margin:0"></i>${esc(c.color||'—')}</span></div>
      <div class="group-badge"><b>${g.filter(x=>x.status==='Chưa ghép').length}</b><span>/${g.length} xe</span></div>
    </button>`;
  }).join('')||'<div class="empty-result">Không có nhóm xe phù hợp.</div>';

  const groupPool=cockpitGroup==='ALL'?visible:visible.filter(c=>liveKey(c)===cockpitGroup);
  const versions=[...new Set(groupPool.map(c=>c.version).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));
  if(cockpitVersion&&!versions.includes(cockpitVersion))cockpitVersion='';
  $('cockpit-version').innerHTML='<option value="">Tất cả phiên bản</option>'+versions.map(v=>`<option value="${esc(v)}" ${v===cockpitVersion?'selected':''}>${esc(v)}</option>`).join('');

  const vinList=groupPool.filter(c=>!cockpitVersion||c.version===cockpitVersion);
  if(!vinList.some(c=>c.vin===selectedVIN))selectedVIN=vinList[0]?.vin||'';
  $('cv-title').textContent=cockpitGroup==='ALL'?'2 · Danh sách VIN':'2 · '+cockpitGroup.split('|')[0];
  $('cv-count').textContent='('+vinList.length+')';

  $('cockpit-vins').innerHTML=vinList.map(c=>`<article class="cockpit-vin ${c.vin===selectedVIN?'active':''}" data-cvin="${esc(c.vin)}" tabindex="0">
    <div class="cockpit-vin-top"><span class="cockpit-vin-code">${esc(c.vin)}</span><span class="status" style="--tone:${tone(c.status)}">${esc(c.status)}</span></div>
    <div class="cockpit-vin-mid"><span>${esc(c.model)} · ${esc(c.version||'—')}</span><span>${esc(c.location||'—')}</span></div>
    <div class="cockpit-vin-bot"><span class="cockpit-vin-holder">${c.holder?'Giữ: '+esc(c.holder):esc((c.color||'—')+' / '+(c.interior||'—'))}</span>${actionHTML(c)}</div>
  </article>`).join('')||'<div class="empty-result">Không có VIN nào trong nhóm này.</div>';

  $('cockpit-groups').querySelectorAll('[data-cg]').forEach(b=>b.onclick=()=>{cockpitGroup=b.dataset.cg;renderStock()});
  $('cockpit-vins').querySelectorAll('[data-cvin]').forEach(row=>{
    row.onclick=e=>{if(e.target.closest('[data-action],[data-more-vin]'))return;selectedVIN=row.dataset.cvin;renderStock()};
    row.onkeydown=e=>{if(e.target===row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectedVIN=row.dataset.cvin;renderStock()}};
  });
  bindActions($('cockpit-vins'));
  bindMore($('cockpit-vins'));
  enhanceImages($('cockpit-groups'));
  renderCockpitDetail();
};
$('cockpit-version').onchange=e=>{cockpitVersion=e.target.value;renderStock()};
const origShowMore25=showMore;
showMore=function(c,trigger){origShowMore25(c,trigger);menu.querySelectorAll('[data-menu-action="detail"],[data-menu-action="logs"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.menuAction;closeMore();selectedVIN=c.vin;detailTab=a==='logs'?'logs':'specs';renderStock()})};
document.querySelector('.demo-head p').textContent='Bàn điều hành 3 cột song song · Duyệt Nhóm xe → VIN → Hộ chiếu xe không che màn hình';
document.querySelector('.demo-footer span').textContent='MẪU 25 · TRI-COLUMN SPLIT COCKPIT · DỮ LIỆU KHO THẬT';

loadLiveStock();
</script></body></html>
